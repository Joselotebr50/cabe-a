<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#a9e4ff">
<title>Cabeça de Animais 🐾</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="app">

  <section id="telaMenu" class="tela">
    <div class="menu-hero">
      <div class="logo">🐾</div>
      <h1>Cabeça de Animais</h1>
      <p>Dê cabeça para os bichinhos!</p>
    </div>
    <div class="menu-acoes">
      <button id="btnJogar" class="btn-grande">▶️ Jogar</button>
      <button id="btnEscolher" class="btn-grande btn-sec">🗺️ Escolher Fase</button>
    </div>
    <div class="menu-rodape">
      <button id="btnSomMenu" class="icon-btn" aria-label="Ligar ou desligar som">🔊</button>
      <button id="btnZerar" class="btn-mini">Zerar progresso</button>
    </div>
  </section>

  <section id="telaMapa" class="tela hidden">
    <header class="topbar">
      <button id="btnMapaVoltar" class="icon-btn" aria-label="Voltar">←</button>
      <h2>Escolha a Fase</h2>
      <div class="spacer"></div>
    </header>
    <div id="gridFases" class="grid-fases"></div>
  </section>

  <section id="telaJogo" class="tela hidden">
    <header class="topbar">
      <button id="btnJogoVoltar" class="icon-btn" aria-label="Voltar">←</button>
      <h2 id="jogoTitulo">Fase 1</h2>
      <button id="btnReiniciarFase" class="icon-btn" aria-label="Recomeçar fase">🔄</button>
    </header>
    <div class="pips" id="pips"></div>
    <div id="stage">
      <div id="decor" aria-hidden="true"></div>
      <div class="target" aria-hidden="true"></div>
      <div id="bodyWrap"></div>
      <div id="heads"></div>
      <div id="nomeLabel" aria-live="polite"></div>
      <div id="toast" role="status"></div>
      <div id="overlay" class="hidden"></div>
    </div>
  </section>

</div>

<script src="audio.js"></script>
<script src="jogo.js"></script>
</body>
</html>
