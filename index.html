<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#a9e4ff">
<title>Cabeça de Animais 🐾</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Baloo 2','Comic Sans MS','Chalkboard SE','Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#a9e4ff 0%,#cdefff 42%,#d7f5c4 100%);
    color:#2c3e50;
    display:flex;justify-content:center;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  button{font-family:inherit;font-weight:700;cursor:pointer;border:none;}

  /* ====== APP / TELAS ====== */
  .app{width:100%;max-width:540px;height:100dvh;height:100vh;position:relative;}
  .tela{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    padding:10px 12px 12px;gap:8px;
    transition:opacity .25s;
  }
  .tela.hidden{opacity:0;pointer-events:none;}

  /* ====== TOPBAR ====== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    flex:0 0 auto;
  }
  .topbar h2{
    font-size:clamp(15px,4.2vw,20px);margin:0;color:#1f6f9c;
    text-shadow:0 2px 0 #fff;text-align:center;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .icon-btn{
    padding:7px 12px;font-size:17px;line-height:1;
    border-radius:999px;background:#fff;color:#1f6f9c;
    box-shadow:0 4px 0 #cfe6f2, 0 6px 14px #5aa9d633;
    transition:transform .1s, box-shadow .1s;
    min-width:38px;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cfe6f2;}
  .spacer{width:38px;}

  /* ====== MENU ====== */
  #telaMenu{
    align-items:center;justify-content:center;text-align:center;gap:18px;
  }
  .menu-hero{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .menu-hero .logo{font-size:70px;line-height:1;animation:pulsa 2.5s ease-in-out infinite;}
  @keyframes pulsa{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .menu-hero h1{
    font-size:clamp(24px,7vw,34px);margin:0;color:#1f6f9c;
    text-shadow:0 3px 0 #fff;
  }
  .menu-hero p{
    margin:0;color:#5b7285;font-size:clamp(14px,4vw,17px);
  }
  .menu-acoes{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;}
  .btn-grande{
    padding:16px 22px;font-size:20px;border-radius:22px;
    background:linear-gradient(180deg,#ffd75e,#ffbb1a);
    color:#7a4d00;
    box-shadow:0 6px 0 #c78a00, 0 12px 24px #c78a0033;
    transition:transform .1s, box-shadow .1s;
  }
  .btn-grande:active{transform:translateY(4px);box-shadow:0 2px 0 #c78a00;}
  .btn-sec{
    background:#fff;color:#1f6f9c;
    box-shadow:0 6px 0 #cfe6f2, 0 12px 24px #5aa9d633;
  }
  .btn-sec:active{box-shadow:0 2px 0 #cfe6f2;}
  .menu-rodape{
    margin-top:8px;display:flex;align-items:center;gap:12px;
  }
  .btn-mini{
    background:transparent;color:#8497a5;font-size:13px;
    padding:6px 10px;border-radius:10px;
    box-shadow:none;
  }
  .btn-mini:hover{background:#ffffff88;}

  /* ====== MAPA DE FASES ====== */
  .grid-fases{
    flex:1;min-height:0;overflow-y:auto;
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:10px;padding:4px 2px 8px;
  }
  .fase-card{
    background:#fff;border-radius:20px;
    padding:12px 10px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    box-shadow:0 4px 0 #d8e8f0, 0 8px 20px #00000010;
    transition:transform .1s, box-shadow .1s;
    color:#1f6f9c;
  }
  .fase-card:not(.bloqueada):active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #d8e8f0;
  }
  .fase-card .num{
    font-size:13px;font-weight:800;color:#8497a5;
    letter-spacing:1px;
  }
  .fase-card .emoji{font-size:36px;line-height:1;}
  .fase-card .tema{
    font-size:12px;line-height:1.15;color:#3a5364;
    min-height:28px;display:flex;align-items:center;justify-content:center;
  }
  .fase-card .estrelas{
    font-size:14px;letter-spacing:1px;line-height:1;
    color:#ffbb1a;
  }
  .fase-card .estrelas .vazia{color:#d6e0e6;}
  .fase-card.bloqueada{
    background:#eef3f6;color:#9aabba;
    cursor:not-allowed;
  }
  .fase-card.bloqueada .emoji{filter:grayscale(1) opacity(.6);}
  .fase-card.bloqueada .cadeado{
    font-size:22px;color:#9aabba;
  }

  /* ====== JOGO ====== */
  .pips{
    display:flex;justify-content:center;gap:4px;
    padding:2px 0;font-size:18px;flex:0 0 auto;
  }
  .pip{opacity:.22;filter:grayscale(1);transition:all .25s;}
  .pip.done{opacity:1;filter:none;transform:scale(1.18);}

  #stage{
    position:relative;margin:0 auto;
    width:min(100%, calc(100dvh - 190px));
    aspect-ratio:1/1;flex:0 0 auto;
    border-radius:30px;
    background:radial-gradient(circle at 50% 38%, #ffffffdd, #ffffff66 62%, #ffffff22 100%);
    box-shadow:inset 0 0 0 3px #ffffff99, 0 10px 26px #5aa9d62e;
    touch-action:none;overflow:hidden;
    --hs: min(18vw, 88px);
  }
  #bodyWrap{
    position:absolute;left:50%;top:52%;width:46%;
    transform:translate(-50%,-50%);pointer-events:none;
    transition:opacity .3s;
  }
  #bodyWrap svg{width:100%;height:auto;display:block;}

  .target{
    position:absolute;left:50%;top:35%;
    width:calc(var(--hs) * 1.2);height:calc(var(--hs) * 1.2);
    border-radius:50%;
    border:3px dashed #ffffffdd;
    box-shadow:0 0 18px #ffffffaa inset;
    transform:translate(-50%,-50%);
    animation:alvoPulsa 2s ease-in-out infinite;
    pointer-events:none;z-index:1;
  }
  @keyframes alvoPulsa{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.45;}
    50%{transform:translate(-50%,-50%) scale(1.13);opacity:.95;}
  }

  #heads{position:absolute;inset:0;pointer-events:none;}
  .head{
    position:absolute;
    width:var(--hs);height:var(--hs);
    transform:translate(-50%,-50%) translate(var(--dx,0),var(--dy,0)) scale(var(--s,1));
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s;
    cursor:grab;touch-action:none;z-index:5;
    will-change:transform;
    pointer-events:auto;
  }
  .head.dragging{cursor:grabbing;z-index:25;transition:none;}
  .head.esconder{opacity:0;transform:translate(-50%,-50%) scale(.4);}
  .head-inner{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #ffffff, #ffefc9 72%);
    box-shadow:0 6px 0 #e8cc8f, 0 10px 18px #00000024, inset 0 -4px 10px #00000012;
    display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--hs) * .6);line-height:1;
    pointer-events:none;-webkit-user-drag:none;
  }
  .head-inner.shake{animation:tremer .5s;}
  @keyframes tremer{
    0%,100%{transform:translateX(0) rotate(0);}
    20%{transform:translateX(-9px) rotate(-7deg);}
    50%{transform:translateX(9px) rotate(7deg);}
    80%{transform:translateX(-5px) rotate(-3deg);}
  }

  #nomeLabel{
    position:absolute;left:50%;top:80%;
    transform:translate(-50%,-50%) scale(.4);
    background:#fff;color:#1f6f9c;
    padding:8px 22px;border-radius:999px;
    font-weight:800;font-size:clamp(18px,5.6vw,26px);
    letter-spacing:1px;text-transform:uppercase;white-space:nowrap;
    box-shadow:0 6px 0 #cfe6f2, 0 12px 24px #5aa9d640;
    opacity:0;pointer-events:none;z-index:40;
    transition:opacity .28s, transform .38s cubic-bezier(.34,1.56,.64,1);
  }
  #nomeLabel.show{
    opacity:1;transform:translate(-50%,-50%) scale(1);
    animation:balanca .5s ease-in-out .38s;
  }
  @keyframes balanca{
    0%,100%{transform:translate(-50%,-50%) scale(1) rotate(0);}
    25%{transform:translate(-50%,-50%) scale(1.06) rotate(-2deg);}
    75%{transform:translate(-50%,-50%) scale(1.06) rotate(2deg);}
  }

  #toast{
    position:absolute;left:50%;top:5%;
    transform:translate(-50%,-14px);
    background:#fff;color:#d64545;
    padding:9px 18px;border-radius:999px;
    font-weight:700;font-size:clamp(13px,3.6vw,16px);
    text-align:center;max-width:90%;
    box-shadow:0 8px 20px #00000022, inset 0 0 0 3px #ffe1e1;
    opacity:0;pointer-events:none;z-index:50;
    transition:opacity .25s, transform .25s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  .spark{position:absolute;pointer-events:none;z-index:35;animation:voar .85s ease-out forwards;}
  @keyframes voar{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:0;}
    30%{opacity:1;}
    100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1.15);opacity:0;}
  }
  .confete{position:absolute;top:-40px;pointer-events:none;z-index:55;animation:cair linear forwards;}
  @keyframes cair{to{top:112%;opacity:0;transform:rotate(420deg);}}

  /* ====== OVERLAY / FIM DE FASE ====== */
  #overlay{
    position:absolute;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;
    background:#ffffffd9;border-radius:30px;
    transition:opacity .25s;padding:14px;
  }
  #overlay.hidden{opacity:0;pointer-events:none;}
  .win-card{
    text-align:center;padding:20px 22px 20px;background:#fff;
    border-radius:26px;box-shadow:0 14px 34px #00000026;
    animation:popin .45s cubic-bezier(.34,1.56,.64,1);
    max-width:100%;
  }
  @keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .win-card .trofeu{font-size:56px;line-height:1;animation:pulsa 1.4s ease-in-out infinite;}
  .win-card h2{margin:8px 0 4px;color:#1f6f9c;font-size:clamp(20px,6vw,28px);}
  .win-card p{margin:0 0 8px;font-size:clamp(13px,3.8vw,16px);color:#5b7285;}
  .win-card .estrelas-fim{
    font-size:clamp(28px,8vw,42px);letter-spacing:6px;
    margin:6px 0 14px;color:#ffbb1a;
  }
  .win-card .estrelas-fim .vazia{color:#e5ebee;}
  .win-card .acoes{
    display:flex;flex-direction:column;gap:8px;
    margin-top:6px;
  }
  .win-card .acoes button{
    padding:12px 18px;font-size:16px;border-radius:16px;
    background:linear-gradient(180deg,#ffd75e,#ffbb1a);color:#7a4d00;
    box-shadow:0 4px 0 #c78a00, 0 8px 18px #c78a0033;
    transition:transform .1s, box-shadow .1s;
  }
  .win-card .acoes button:active{transform:translateY(3px);box-shadow:0 1px 0 #c78a00;}
  .win-card .acoes button.sec{
    background:#fff;color:#1f6f9c;
    box-shadow:0 4px 0 #cfe6f2, 0 8px 18px #5aa9d633;
  }
  .win-card .acoes button.sec:active{box-shadow:0 1px 0 #cfe6f2;}
</style>
</head>
<body>
<div class="app">

  <!-- ======== TELA MENU ======== -->
  <section id="telaMenu" class="tela">
    <div class="menu-hero">
      <div class="logo">🐾</div>
      <h1>Cabeça de Animais</h1>
      <p>Dê cabeça para os bichinhos!</p>
    </div>
    <div class="menu-acoes">
      <button id="btnJogar" class="btn-grande">▶️ Jogar</button>
      <button id="btnEscolher" class="btn-grande btn-sec">🗺️ Escolher Fase</button>
    </div>
    <div class="menu-rodape">
      <button id="btnSomMenu" class="icon-btn" aria-label="Ligar ou desligar som">🔊</button>
      <button id="btnZerar" class="btn-mini">Zerar progresso</button>
    </div>
  </section>

  <!-- ======== TELA MAPA ======== -->
  <section id="telaMapa" class="tela hidden">
    <header class="topbar">
      <button id="btnMapaVoltar" class="icon-btn" aria-label="Voltar">←</button>
      <h2>Escolha a Fase</h2>
      <div class="spacer"></div>
    </header>
    <div id="gridFases" class="grid-fases"></div>
  </section>

  <!-- ======== TELA JOGO ======== -->
  <section id="telaJogo" class="tela hidden">
    <header class="topbar">
      <button id="btnJogoVoltar" class="icon-btn" aria-label="Voltar">←</button>
      <h2 id="jogoTitulo">Fase 1</h2>
      <button id="btnReiniciarFase" class="icon-btn" aria-label="Recomeçar fase">🔄</button>
    </header>
    <div class="pips" id="pips"></div>
    <div id="stage">
      <div class="target" aria-hidden="true"></div>
      <div id="bodyWrap"></div>
      <div id="heads"></div>
      <div id="nomeLabel" aria-live="polite"></div>
      <div id="toast" role="status"></div>
      <div id="overlay" class="hidden"></div>
    </div>
  </section>

</div>

<script>
/* =========================================================
   ANIMAIS (21 no total)
   ========================================================= */
const ANIMAIS = {
  /* Casa */
  gato:       { emoji:'🐱', nome:'Gato',       cor:'#F2A25C', escuro:'#D9833A', claro:'#FFD9B0', som:'Miau! Miau!' },
  cachorro:   { emoji:'🐶', nome:'Cachorro',   cor:'#C99A66', escuro:'#A87A48', claro:'#EBC9A3', som:'Au au! Au au!' },
  coelho:     { emoji:'🐰', nome:'Coelho',     cor:'#F0E8DF', escuro:'#B4A594', claro:'#FFFFFF', som:'Nhac nhac!' },
  passarinho: { emoji:'🐦', nome:'Passarinho', cor:'#7EC0E8', escuro:'#4A8FBC', claro:'#C8E8F8', som:'Piu piu!' },
  peixinho:   { emoji:'🐠', nome:'Peixinho',   cor:'#FF8C6B', escuro:'#D5623F', claro:'#FFD1BE', som:'Glub glub!' },
  hamster:    { emoji:'🐹', nome:'Hamster',    cor:'#E2B878', escuro:'#B98E4D', claro:'#F8E4B8', som:'Iiii iiii!' },

  /* Fazenda */
  vaca:       { emoji:'🐮', nome:'Vaca',       cor:'#F3EEE4', escuro:'#4A4A4A', claro:'#FFFFFF', som:'Muuu! Muuu!' },
  porco:      { emoji:'🐷', nome:'Porco',      cor:'#F5A8C0', escuro:'#DE7F9E', claro:'#FFD3E0', som:'Oinc! Oinc!' },
  ovelha:     { emoji:'🐑', nome:'Ovelha',     cor:'#F0EBE1', escuro:'#C4B9A5', claro:'#FFFFFF', som:'Bééé! Bééé!' },
  galinha:    { emoji:'🐔', nome:'Galinha',    cor:'#FFE9A8', escuro:'#D9B84A', claro:'#FFF5CC', som:'Có có! Có có!' },
  cavalo:     { emoji:'🐴', nome:'Cavalo',     cor:'#B07A50', escuro:'#8A5A34', claro:'#D8B080', som:'Iii hiii!' },
  pato:       { emoji:'🦆', nome:'Pato',       cor:'#F5E64C', escuro:'#C8B420', claro:'#FFF5A0', som:'Quá quá!' },

  /* Selva */
  leao:       { emoji:'🦁', nome:'Leão',       cor:'#E8B84B', escuro:'#C28F2A', claro:'#FFE6A8', som:'Roar!' },
  elefante:   { emoji:'🐘', nome:'Elefante',   cor:'#A0A4B0', escuro:'#70757F', claro:'#C8CCD6', som:'Fuummm!' },
  macaco:     { emoji:'🐵', nome:'Macaco',     cor:'#B08058', escuro:'#8A5F3C', claro:'#D8B088', som:'Uhu uhu ah ah!' },
  tigre:      { emoji:'🐯', nome:'Tigre',      cor:'#F0A020', escuro:'#C77800', claro:'#FFD280', som:'Grrr!' },
  panda:      { emoji:'🐼', nome:'Panda',      cor:'#F8F8F8', escuro:'#444444', claro:'#FFFFFF', som:'Nhac nhac!' },

  /* Água */
  sapo:       { emoji:'🐸', nome:'Sapo',       cor:'#7BC85C', escuro:'#5AA23C', claro:'#B6E89B', som:'Croac! Croac!' },
  golfinho:   { emoji:'🐬', nome:'Golfinho',   cor:'#88C8E8', escuro:'#5090B0', claro:'#C0E4F5', som:'Iii! Iii!' },
  baleia:     { emoji:'🐳', nome:'Baleia',     cor:'#6EB0D8', escuro:'#3D80A8', claro:'#A8D8F0', som:'Uuuuuu!' },
  pinguim:    { emoji:'🐧', nome:'Pinguim',    cor:'#3A3A3A', escuro:'#000000', claro:'#FFFFFF', som:'Nhonhonho!' },
  tartaruga:  { emoji:'🐢', nome:'Tartaruga',  cor:'#7CB860', escuro:'#4A8A3A', claro:'#B0DC98', som:'Uuuu!' }
};

const TODOS = Object.keys(ANIMAIS);

/* =========================================================
   FASES
   ========================================================= */
const FASES = [
  { tema:'Casa I',         emoji:'🏡', fundo:['#a9e4ff','#cdefff','#ffe6b8'],
    animais:['gato','cachorro','coelho','passarinho'],
    opcoes:3, acertos:4 },
  { tema:'Casa II',        emoji:'🏠', fundo:['#a9e4ff','#cdefff','#ffe6b8'],
    animais:['gato','cachorro','coelho','passarinho','peixinho','hamster'],
    opcoes:3, acertos:4 },
  { tema:'Fazenda I',      emoji:'🚜', fundo:['#b8e6a0','#d7f5c4','#f0f8d0'],
    animais:['vaca','porco','ovelha','galinha'],
    opcoes:3, acertos:5 },
  { tema:'Fazenda II',     emoji:'🌾', fundo:['#b8e6a0','#d7f5c4','#f0f8d0'],
    animais:['vaca','porco','ovelha','galinha','cavalo','pato'],
    opcoes:4, acertos:5 },
  { tema:'Selva',          emoji:'🌴', fundo:['#7bc06a','#a8d88a','#d8e8a8'],
    animais:['leao','elefante','macaco','tigre','panda'],
    opcoes:4, acertos:5 },
  { tema:'Água',           emoji:'🌊', fundo:['#7ec8e8','#a8e0f5','#d0f0ff'],
    animais:['sapo','golfinho','baleia','pinguim','tartaruga'],
    opcoes:4, acertos:5 },
  { tema:'Tudo Junto!',    emoji:'🌈', fundo:['#ffb3d9','#ffd9f0','#c8e8ff'],
    animais: TODOS,
    opcoes:4, acertos:6 },
  { tema:'Desafio Final',  emoji:'🏆', fundo:['#ffd966','#ffe9a8','#fff5cc'],
    animais: TODOS,
    opcoes:5, acertos:6 }
];

const POSICOES = {
  3: [
    { x: 14, y: 42 },
    { x: 86, y: 42 },
    { x: 50, y: 86 }
  ],
  4: [
    { x: 12, y: 40 },
    { x: 88, y: 40 },
    { x: 22, y: 84 },
    { x: 78, y: 84 }
  ],
  5: [
    { x: 12, y: 22 },
    { x: 88, y: 22 },
    { x: 10, y: 68 },
    { x: 90, y: 68 },
    { x: 50, y: 92 }
  ]
};
const ALVO = { x: 50, y: 35 };

/* =========================================================
   PROGRESSO (localStorage)
   ========================================================= */
const STORAGE_KEY = 'cabecaAnimais.progresso.v1';
let progresso = { maxFase: 1, estrelas: {} };

function carregarProgresso(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const o = JSON.parse(raw);
      if (o && typeof o === 'object'){
        if (typeof o.maxFase === 'number') progresso.maxFase = o.maxFase;
        if (o.estrelas && typeof o.estrelas === 'object') progresso.estrelas = o.estrelas;
      }
    }
  }catch(e){}
  if (progresso.maxFase < 1) progresso.maxFase = 1;
  if (progresso.maxFase > FASES.length) progresso.maxFase = FASES.length;
}
function salvarProgresso(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progresso)); }catch(e){}
}

/* =========================================================
   ESTADO GERAL
   ========================================================= */
const telaMenu = document.getElementById('telaMenu');
const telaMapa = document.getElementById('telaMapa');
const telaJogo = document.getElementById('telaJogo');
const gridFases= document.getElementById('gridFases');
const jogoTitulo = document.getElementById('jogoTitulo');

const stage     = document.getElementById('stage');
const headsEl   = document.getElementById('heads');
const bodyWrap  = document.getElementById('bodyWrap');
const toastEl   = document.getElementById('toast');
const nomeLabel = document.getElementById('nomeLabel');
const pipsEl    = document.getElementById('pips');
const overlay   = document.getElementById('overlay');

const btnSomMenu = document.getElementById('btnSomMenu');

let somLigado = true;

/* fase em execução */
let faseAtual    = null;   /* { index, config } */
let acertos      = 0;
let erros        = 0;
let atual        = null;   /* animal correto da rodada */
let ultimoId     = null;
let travado      = false;
let animando     = false;

/* =========================================================
   ÁUDIO (jingle)
   ========================================================= */
let ctxAudio = null;
function pegarCtx(){
  if (!ctxAudio){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctxAudio = new AC();
  }
  if (ctxAudio.state === 'suspended') ctxAudio.resume();
  return ctxAudio;
}
function nota(freq, inicio, dur, tipo='triangle', vol=0.16){
  if (!somLigado) return;
  const c = pegarCtx(); if (!c) return;
  const t0 = c.currentTime + inicio;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.06);
}
const tocarAcerto = () => {
  nota(523.25, 0.00, 0.18);
  nota(659.25, 0.11, 0.18);
  nota(783.99, 0.22, 0.34);
};
const tocarErro = () => {
  nota(294, 0.00, 0.20, 'triangle', 0.13);
  nota(220, 0.17, 0.30, 'triangle', 0.13);
};
const tocarFanfarra = () => {
  nota(523.25, 0.00, 0.15);
  nota(659.25, 0.13, 0.15);
  nota(783.99, 0.26, 0.15);
  nota(1046.5, 0.40, 0.45);
};

/* =========================================================
   VOZ
   ========================================================= */
function prepararVozes(){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {};
}
prepararVozes();

function acharVozBR(){
  const vozes = window.speechSynthesis.getVoices() || [];
  return vozes.find(v => /pt[-_]?BR/i.test(v.lang))
      || vozes.find(v => /^pt/i.test(v.lang)) || null;
}
function criarFala(texto, pitch=1.3, rate=0.9){
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR';
  u.rate = rate; u.pitch = pitch; u.volume = 1;
  const v = acharVozBR();
  if (v) u.voice = v;
  return u;
}
function falar(texto){
  if (!somLigado || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(criarFala(texto));
  }catch(e){}
}
function falarNomeESom(nome, som){
  if (!somLigado || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(criarFala(nome + '!', 1.25, 0.85));
    window.speechSynthesis.speak(criarFala(som,         1.45, 0.9));
  }catch(e){}
}

/* =========================================================
   HELPERS
   ========================================================= */
const rand = n => Math.floor(Math.random()*n);
function shuffle(arr){
  for (let i=arr.length-1;i>0;i--){
    const j = rand(i+1);
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function mostrarTela(qual){
  telaMenu.classList.toggle('hidden', qual !== 'menu');
  telaMapa.classList.toggle('hidden', qual !== 'mapa');
  telaJogo.classList.toggle('hidden', qual !== 'jogo');
}

/* =========================================================
   SVG DO CORPO
   ========================================================= */
function bodySVG(a){

  <svg viewBox="0 0 120 112" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="60" cy="101" rx="40" ry="6" fill="#000" opacity=".09"/>
    <path d="M97 54 q20 -6 16 -26" fill="none" stroke="${a.escuro}"
          stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <rect x="26" y="72" width="15" height="24" rx="7" fill="${a.escuro}"/>
    <rect x="46" y="76" width="15" height="20" rx="7" fill="${a.cor}"/>
    <rect x="66" y="76" width="15" height="20" rx="7" fill="${a.cor}"/>
    <rect x="84" y="72" width="15" height="24" rx="7" fill="${a.escuro}"/>
    <ellipse cx="60" cy="60" rx="45" ry="33" fill="${a.cor}"
             stroke="${a.escuro}" stroke-opacity=".35" stroke-width="3"/>
    <ellipse cx="60" cy="70" rx="28" ry="18" fill="${a.claro}" opacity=".5"/>
    <ellipse cx="60" cy="30" rx="17" ry="11" fill="${a.cor}"
             stroke="${a.escuro}" stroke-opacity=".35" stroke-width="3"/>
  </svg>`;
}

/* =========================================================
   TAMANHO DAS CABEÇAS
   ========================================================= */
function ajustarUnidade(){
  const w = stage.clientWidth || 320;
  const n = faseAtual ? faseAtual.config.opcoes : 3;
  const fator = n >= 5 ? 0.18 : n === 4 ? 0.20 : 0.22;
  stage.style.setProperty('--hs', (w * fator) + 'px');
}
window.addEventListener('resize', ajustarUnidade);
window.addEventListener('orientationchange', () => setTimeout(ajustarUnidade, 120));

/* =========================================================
   MENU / MAPA
   ========================================================= */
function atualizarEstrelasMenu(){
  btnSomMenu.textContent = somLigado ? '🔊' : '🔇';
}

function montarMapa(){
  gridFases.innerHTML = '';
  FASES.forEach((f, i) => {
    const num = i + 1;
    const liberada = num <= progresso.maxFase;
    const estrelas = progresso.estrelas[num] || 0;

    const btn = document.createElement('button');
    btn.className = 'fase-card' + (liberada ? '' : ' bloqueada');
    btn.type = 'button';

    if (liberada){
      let estrelasHTML = '';
      for (let k=0;k<3;k++){
        estrelasHTML += k < estrelas
          ? '⭐'
          : '<span class="vazia">⭐</span>';
      }
      btn.innerHTML = `
        <div class="num">FASE ${num}</div>
        <div class="emoji">${f.emoji}</div>
        <div class="tema">${f.tema}</div>
        <div class="estrelas">${estrelasHTML}</div>
      `;
      btn.addEventListener('click', () => abrirFase(num));
    } else {
      btn.innerHTML = `
        <div class="num">FASE ${num}</div>
        <div class="emoji">${f.emoji}</div>
        <div class="tema">${f.tema}</div>
        <div class="cadeado">🔒</div>
      `;
    }
    gridFases.appendChild(btn);
  });
}

/* =========================================================
   ABRIR / INICIAR FASE
   ========================================================= */
function abrirFase(numero){
  const i = Math.max(0, Math.min(FASES.length-1, numero-1));
  faseAtual = { index: i, config: FASES[i] };

  /* aplica cores do fundo */
  const [c1,c2,c3] = faseAtual.config.fundo;
  document.body.style.background = `linear-gradient(180deg,${c1} 0%,${c2} 42%,${c3} 100%)`;

  jogoTitulo.textContent = `Fase ${numero} · ${faseAtual.config.tema}`;

  acertos = 0;
  erros   = 0;
  ultimoId = null;
  atual = null;
  travado = false;
  animando = false;

  overlay.classList.add('hidden');
  overlay.innerHTML = '';

  mostrarTela('jogo');
  /* aguarda layout para medir o stage */
  requestAnimationFrame(() => {
    ajustarUnidade();
    iniciarRodada();
  });
}

function atualizarPips(){
  const total = faseAtual ? faseAtual.config.acertos : 5;
  pipsEl.innerHTML = '';
  for (let i=0; i<total; i++){
    const s = document.createElement('span');
    s.className = 'pip' + (i < acertos ? ' done' : '');
    s.textContent = '🐾';
    pipsEl.appendChild(s);
  }
}

/* =========================================================
   RODADA
   ========================================================= */
function iniciarRodada(){
  travado = false;
  headsEl.innerHTML = '';
  toastEl.classList.remove('show');
  nomeLabel.classList.remove('show');
  overlay.classList.add('hidden');
  overlay.innerHTML = '';

  const lista = faseAtual.config.animais;
  const pool = lista.filter(id => id !== ultimoId);
  const idCorreto = pool[rand(pool.length)];
  atual = { id: idCorreto, ...ANIMAIS[idCorreto] };
  ultimoId = idCorreto;

  bodyWrap.innerHTML = bodySVG(atual);

  /* distratores (n-1) */
  const outrosIds = shuffle(lista.filter(id => id !== idCorreto));
  const qtd = Math.min(faseAtual.config.opcoes, lista.length);
  const idsRodada = [idCorreto, ...outrosIds.slice(0, qtd-1)];
  shuffle(idsRodada);

  const posicoes = POSICOES[qtd] || POSICOES[3];

  idsRodada.forEach((id, i) => {
    const animal = { id, ...ANIMAIS[id] };
    const el = document.createElement('div');
    el.className = 'head';
    el.dataset.animal = id;
    el.dataset.bx = posicoes[i].x;
    el.dataset.by = posicoes[i].y;
    el.style.left = posicoes[i].x + '%';
    el.style.top  = posicoes[i].y + '%';
    el.style.setProperty('--s','0');
    el.style.opacity = '0';
    el.innerHTML = `<div class="head-inner">${animal.emoji}</div>`;
    headsEl.appendChild(el);

    ligarArraste(el, animal);
    setTimeout(() => {
      el.style.opacity = '1';
      el.style.setProperty('--s','1');
    }, 60 + i*90);
  });

  atualizarPips();
  ajustarUnidade();
}

/* =========================================================
   ARRASTAR / TOCAR
   ========================================================= */
function ligarArraste(el, animal){
  let arrastando = false, pid = null;
  let sx=0, sy=0, dx=0, dy=0;

  el.addEventListener('pointerdown', e => {
    if (travado) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    pid = e.pointerId;
    try{ el.setPointerCapture(pid); }catch(_){}
    arrastando = true;
    sx = e.clientX; sy = e.clientY;
    dx = 0; dy = 0;
    el.classList.add('dragging');
    el.style.transition = 'none';
  });

  el.addEventListener('pointermove', e => {
    if (!arrastando || e.pointerId !== pid) return;
    e.preventDefault();
    dx = e.clientX - sx;
    dy = e.clientY - sy;
    el.style.setProperty('--dx', dx + 'px');
    el.style.setProperty('--dy', dy + 'px');
  });

  function soltar(e){
    if (!arrastando || e.pointerId !== pid) return;
    arrastando = false; pid = null;
    el.classList.remove('dragging');
    el.style.transition = '';
    if (travado) return;

    const andou = Math.hypot(dx, dy);
    if (andou < 12){
      escolher(el, animal);
      return;
    }
    const r  = el.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    const cx = r.left + r.width/2  - sr.left;
    const cy = r.top  + r.height/2 - sr.top;
    const alvoX = sr.width  * 0.5;
    const alvoY = sr.height * 0.52;
    if (Math.hypot(cx-alvoX, cy-alvoY) < sr.width * 0.32){
      escolher(el, animal);
    } else {
      voltarAoLugar(el);
    }
  }

  el.addEventListener('pointerup', soltar);
  el.addEventListener('pointercancel', soltar);
}

function voltarAoLugar(el){
  el.style.setProperty('--dx','0px');
  el.style.setProperty('--dy','0px');
}

/* =========================================================
   ESCOLHA
   ========================================================= */
function escolher(el, animal){
  if (travado) return;
  travado = true;
  if (animal.id === atual.id) acertou(el);
  else errou(el);
}

function acertou(el){
  const sr = stage.getBoundingClientRect();
  const bx = parseFloat(el.dataset.bx)/100 * sr.width;
  const by = parseFloat(el.dataset.by)/100 * sr.height;
  const tx = sr.width  * (ALVO.x/100) - bx;
  const ty = sr.height * (ALVO.y/100) - by;

  el.style.transition = 'transform .42s cubic-bezier(.34,1.56,.64,1), opacity .3s';
  void el.offsetWidth;
  el.style.zIndex = '12';
  el.style.setProperty('--dx', tx+'px');
  el.style.setProperty('--dy', ty+'px');

  [...headsEl.children].forEach(h => { if (h !== el) h.classList.add('esconder'); });

  explodir(sr.width * (ALVO.x/100), sr.height * (ALVO.y/100));
  tocarAcerto();

  setTimeout(() => {
    nomeLabel.textContent = atual.emoji + ' ' + atual.nome.toUpperCase();
    nomeLabel.classList.remove('show');
    void nomeLabel.offsetWidth;
    nomeLabel.classList.add('show');
  }, 260);

  setTimeout(() => falarNomeESom(atual.nome, atual.som), 560);

  acertos++;
  atualizarPips();

  setTimeout(() => {
    if (acertos >= faseAtual.config.acertos) terminarFase();
    else iniciarRodada();
  }, 2900);
}

function errou(el){
  erros++;
  tocarErro();
  mostrarToast('Ops! Tente de novo! 🙈');
  voltarAoLugar(el);
  const inner = el.querySelector('.head-inner');
  inner.classList.add('shake');
  setTimeout(() => inner.classList.remove('shake'), 540);
  setTimeout(() => { travado = false; }, 700);
}

/* =========================================================
   AVISO
   ========================================================= */
let toastTimer = null;
function mostrarToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
}

/* =========================================================
   EFEITOS VISUAIS
   ========================================================= */
function explodir(x, y){
  const icones = ['⭐','✨','🌟','💫','⭐'];
  for (let i=0;i<9;i++){
    const s = document.createElement('span');
    s.className = 'spark';
    s.textContent = icones[rand(icones.length)];
    const ang = (Math.PI*2*i/9) + Math.random()*0.6;
    const d = 55 + Math.random()*70;
    s.style.left = x + 'px';
    s.style.top  = y + 'px';
    s.style.fontSize = (15 + Math.random()*16) + 'px';
    s.style.setProperty('--tx', (Math.cos(ang)*d).toFixed(1)+'px');
    s.style.setProperty('--ty', (Math.sin(ang)*d).toFixed(1)+'px');
    stage.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

function soltarConfete(){
  const icones = ['🎉','⭐','✨','🎈','🌈','🍀'];
  for (let i=0;i<28;i++){
    setTimeout(() => {
      const s = document.createElement('span');
      s.className = 'confete';
      s.textContent = icones[rand(icones.length)];
      s.style.left = (Math.random()*96+2) + '%';
      s.style.fontSize = (14 + Math.random()*20) + 'px';
      s.style.animationDuration = (1.7 + Math.random()*1.3) + 's';
      stage.appendChild(s);
      setTimeout(() => s.remove(), 3400);
    }, i*70);
  }
}

/* =========================================================
   FIM DE FASE
   ========================================================= */
function calcularEstrelas(erros){
  if (erros === 0) return 3;
  if (erros <= 2) return 2;
  return 1;
}

function terminarFase(){
  const num = faseAtual.index + 1;
  const estrelas = calcularEstrelas(erros);

  /* salva progresso */
  const anterior = progresso.estrelas[num] || 0;
  if (estrelas > anterior) progresso.estrelas[num] = estrelas;
  if (num === progresso.maxFase && num < FASES.length){
    progresso.maxFase = num + 1;
  }
  salvarProgresso();

  /* UI */
  let estrelasHTML = '';
  for (let k=0;k<3;k++){
    estrelasHTML += k < estrelas
      ? '⭐'
      : '<span class="vazia">⭐</span>';
  }

  const ultima = num === FASES.length;
  const btnProxima = (!ultima)
    ? `<button id="btnProxima">➡️ Próxima fase</button>`
    : '';

  const titulo = ultima ? '🎖️ Mestre dos Bichinhos!' : 'Parabéns!';
  const msg = ultima
    ? 'Você completou todas as fases!'
    : 'Você terminou a Fase ' + num + '!';

  overlay.innerHTML = `
    <div class="win-card">
      <div class="trofeu">${ultima ? '🏆' : '🎉'}</div>
      <h2>${titulo}</h2>
      <p>${msg}</p>
      <div class="estrelas-fim">${estrelasHTML}</div>
      <div class="acoes">
        ${btnProxima}
        <button id="btnRepetir" class="sec">🔁 Jogar de novo</button>
        <button id="btnMenu" class="sec">🏠 Voltar ao menu</button>
      </div>
    </div>`;
  overlay.classList.remove('hidden');

  tocarFanfarra();
  setTimeout(() => {
    falar(ultima
      ? 'Parabéns! Você virou Mestre dos Bichinhos!'
      : 'Parabéns! Você completou a fase!');
  }, 700);
  soltarConfete();

  const btnProx = document.getElementById('btnProxima');
  if (btnProx) btnProx.addEventListener('click', () => abrirFase(num + 1));
  document.getElementById('btnRepetir').addEventListener('click', () => abrirFase(num));
  document.getElementById('btnMenu').addEventListener('click', voltarAoMenu);
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
function voltarAoMenu(){
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  overlay.classList.add('hidden');
  overlay.innerHTML = '';
  document.body.style.background = 'linear-gradient(180deg,#a9e4ff 0%,#cdefff 42%,#d7f5c4 100%)';
  mostrarTela('menu');
}

function abrirMapa(){
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  montarMapa();
  mostrarTela('mapa');
}

function comecarJogo(){
  /* aquece áudio (gesto do usuário) */
  pegarCtx();
  const fase = Math.min(progresso.maxFase, FASES.length);
  abrirFase(fase);
}

/* =========================================================
   BOTÕES
   ========================================================= */
document.getElementById('btnJogar').addEventListener('click', comecarJogo);
document.getElementById('btnEscolher').addEventListener('click', abrirMapa);
document.getElementById('btnMapaVoltar').addEventListener('click', voltarAoMenu);
document.getElementById('btnJogoVoltar').addEventListener('click', voltarAoMenu);
document.getElementById('btnReiniciarFase').addEventListener('click', () => {
  if (faseAtual) abrirFase(faseAtual.index + 1);
});
btnSomMenu.addEventListener('click', () => {
  somLigado = !somLigado;
  atualizarEstrelasMenu();
  if (!somLigado && 'speechSynthesis' in window) window.speechSynthesis.cancel();
});
document.getElementById('btnZerar').addEventListener('click', () => {
  if (confirm('Apagar todo o progresso e começar do zero?')){
    progresso = { maxFase: 1, estrelas: {} };
    salvarProgresso();
    montarMapa();
    mostrarToast('Progresso apagado!');
  }
});

/* =========================================================
   INÍCIO
   ========================================================= */
carregarProgresso();
atualizarEstrelasMenu();
mostrarTela('menu');
window.addEventListener('load', () => setTimeout(ajustarUnidade, 60));
</script>
